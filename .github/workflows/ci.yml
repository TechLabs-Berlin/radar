name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - master

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: nuxt generate
        run: npm run generate
