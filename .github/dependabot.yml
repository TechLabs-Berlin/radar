version: 2
updates:
  # One pull request per month for npm, instead of one per package
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
    assignees:
      - valiantone
    reviewers:
      - valiantone
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      major:
        update-types:
          - major

  # GitHub Actions versions, also once a month
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
    assignees:
      - valiantone
    reviewers:
      - valiantone
    groups:
      actions:
        patterns:
          - "*"
